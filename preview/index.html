<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수능 수학 기출 학습</title>
<link rel="stylesheet" href="katex.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e2e5ea;--text:#1d2330;--muted:#6b7385;--accent:#2f6fde;--accent-soft:#e8f0fd;--ok:#1f9d55;--ok-soft:#e6f6ec;--bad:#d64545;--bad-soft:#fdeceb;--warn:#b7791f;--warn-soft:#fdf5e6}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text);font-size:15px}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;white-space:nowrap}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;font-size:15px;cursor:pointer;color:var(--muted)}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:10px;font-size:12px;background:var(--line);color:var(--muted);text-align:center}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 54px)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:auto;max-height:calc(100vh - 54px);position:sticky;top:54px}
aside h3{font-size:14px;margin:14px 6px 6px;color:var(--muted)}
aside h4{font-size:13px;margin:10px 6px 4px;color:var(--muted);font-weight:500}
.unit{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.unit:hover{background:var(--bg)}
.unit.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.unit .r{display:flex;gap:4px;align-items:center;flex-shrink:0}
.acc{font-size:11px;color:var(--muted)}
main{padding:18px 24px;overflow:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar button,.btn{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.unithead{margin-bottom:10px}
.unithead h2{margin:0 0 4px;font-size:20px}
.unithead p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.card .meta{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.card .thumb{height:170px;overflow:hidden;padding:8px;background:#fff}
.card .thumb img{width:100%}
.st{font-size:12px;padding:2px 8px;border-radius:10px}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.bad{background:var(--bad-soft);color:var(--bad)} .st.none{background:var(--bg);color:var(--muted)}
.pt{color:var(--muted);font-size:12px}
.oos{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:2px 8px;border-radius:10px}
/* solve view */
.overlay{position:fixed;inset:0;background:rgba(20,25,35,.45);display:none;z-index:20;overflow:auto;padding:24px}
.overlay.show{display:block}
.sheet{max-width:1100px;margin:0 auto;background:var(--panel);border-radius:14px;display:grid;grid-template-columns:1fr 330px;min-height:70vh}
.sheet .left{padding:20px;border-right:1px solid var(--line)}
.sheet .right{padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet .left img{max-width:100%;display:block}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.qhead b{font-size:16px}
.choices{display:flex;gap:8px}
.choices button{width:46px;height:46px;font-size:20px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.choices button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.shortans{display:flex;gap:8px}
.shortans input{font:inherit;font-size:18px;width:140px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.result{padding:12px;border-radius:10px;font-weight:600}
.result.ok{background:var(--ok-soft);color:var(--ok)} .result.bad{background:var(--bad-soft);color:var(--bad)}
.intent{font-size:13px;color:var(--muted);background:var(--bg);padding:10px;border-radius:8px}
.sol{margin-top:18px;border-top:2px dashed var(--line);padding-top:14px}
.sol img{max-width:min(100%,480px);display:block;margin-bottom:6px}
.rel h4{margin:0 0 8px;font-size:14px}
.rel .item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13px}
.rel .item:hover{border-color:var(--accent)}
.close{font-size:22px;border:0;background:none;cursor:pointer;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
/* stats */
table.stats{border-collapse:collapse;width:100%;background:var(--panel);border-radius:12px;overflow:hidden}
table.stats th,table.stats td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
table.stats th{background:var(--bg);font-weight:600;color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;width:160px}
.bar i{display:block;height:100%;background:var(--accent)}
.kpis{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:150px}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:40px;text-align:center;background:var(--panel);border-radius:12px;border:1px dashed var(--line)}
/* print list */
.plist .pitem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;break-inside:avoid}
.plist .pitem .src{font-size:12px;color:var(--muted);margin-bottom:6px}
.plist img{max-width:640px;width:100%}
.anskey{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px}
.badge.due{background:var(--warn-soft);color:var(--warn)}
.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.section h3{margin:0 0 6px;font-size:16px}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.exlist button{font:inherit;font-size:14px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.exlist button:hover{border-color:var(--accent)}
.exlist .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.exlist .setdel{color:var(--bad)}
.exlist .setdel:hover{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0;font-size:14px}
.timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.over{color:var(--bad)}
.omr{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.omr button{font:inherit;font-size:13px;padding:6px 0;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
.omr button.has{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.omr button.now{outline:2px solid var(--accent)}
.omr button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.omr button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.score{font-size:40px;font-weight:800}
.mixnote{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;line-height:1.5}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.k-c{background:var(--accent-soft);border-color:#c9dbfa;color:var(--accent)}
.chip.k-w{background:#eaf6f4;border-color:#b5ddd5;color:#1b7a6b}
.chip.k-w.sub{background:transparent}
.chip.zero{opacity:.45;cursor:default}
.chip.d-hi,.dd.d-hi{background:var(--bad-soft);color:var(--bad);border-color:#f3c4c4}
.chip.d-mid,.dd.d-mid{background:var(--warn-soft);color:var(--warn);border-color:#f0dcb4}
.chip.d-lo,.dd.d-lo{background:var(--ok-soft);color:var(--ok);border-color:#bfe5cd}
.chip .n{opacity:.7;margin-left:3px}
body.notags .chip[data-tag]{cursor:default}body.notags .chip[data-tag]:hover{border-color:var(--line)}
.dd{font-size:11px;padding:0 6px;border-radius:8px;border:1px solid;margin-left:4px}
.rel .item .st{white-space:nowrap;flex-shrink:0;margin-left:6px}
.rel .item .why{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.rel .item .pct{font-size:11px;color:var(--accent);font-weight:600;margin-left:6px}
.tgroup{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.tgroup h4{width:100%;margin:8px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.vq{font-family:"Nanum Myeongjo","NanumMyeongjo","Batang","바탕",serif;font-size:16px;line-height:1.85;background:#fff;padding:6px 2px}
.vq .ch{display:flex;flex-wrap:wrap;justify-content:space-between;margin-top:12px}
.vq .ch>span{min-width:18%}
.vq .ch.long>span{min-width:31%;margin-bottom:4px}
.vq .box{border:1px solid #000;padding:8px 12px;margin:10px 0}
.vq .fig{text-align:center;margin:8px 0}
.vq .fig svg{max-width:100%;height:auto}
.vq .fig img{display:inline-block!important}
.vq table.nt{border-collapse:collapse;margin:8px auto;font-size:14px}
.vq table.nt td,.vq table.nt th{border:1px solid #000;padding:1px 10px;text-align:center;font-weight:normal}
.vq .cards{display:flex;justify-content:center;gap:6px;margin:8px 0}
.vq .pcard{text-align:center;font-size:11px;line-height:1.3}
.vq .cf{width:30px;height:40px;border:3px double #777;display:flex;align-items:center;justify-content:center;font-size:17px;margin:0 auto 2px}
.vq .blank{border:1px solid #000;padding:0 6px}
.vq .katex{font-size:1.06em}
.vtag{background:#efe8fb;color:#6b46c1;font-size:12px;padding:2px 8px;border-radius:10px}
.layout.noside{grid-template-columns:1fr}.layout.noside aside{display:none}
@media print{header,aside,.toolbar,.noprint{display:none!important}.layout{display:block}main{padding:0}body{background:#fff}.plist .pitem{border:0;border-bottom:1px solid #ccc;border-radius:0}}
@media (max-width:820px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none}.sheet{grid-template-columns:1fr}.sheet .left{border-right:0}}
/* 실제 시험지 양식 인쇄(A4 세로, 2단, 단마다 문항 2개와 풀이 공간): 인쇄할 때만 #paper가 보이고 나머지는 숨는다 */
#paper{display:none}
#pmeasure{position:absolute;left:-10000px;top:0;width:88mm;visibility:hidden}
@page{size:A4;margin:10mm 11mm 9mm 11mm}
@media print{body.paper-print>*:not(#paper){display:none!important}body.paper-print #paper{display:block}body.paper-print{background:#fff;margin:0}}
#paper,#pmeasure{font-family:'Nanum Myeongjo','NanumMyeongjo','Batang','바탕',serif;font-size:10pt;line-height:1.75;color:#000;background:#fff}
#paper .pg{width:188mm;height:277mm;display:flex;flex-direction:column;break-after:page;overflow:hidden;position:relative}
#paper .pg:last-child{break-after:auto}
#paper .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid #000;padding:0 2mm 2mm;height:12mm}
#paper .ph .t{font-size:17pt;font-weight:700;letter-spacing:3px}
#paper .ph .no{font-size:15pt;min-width:12mm}
#paper .ph .gr{border:1.2px solid #000;border-radius:9px;padding:0 9px;font-size:9.5pt;font-weight:700}
#paper .ph1{border-bottom:1.5px solid #000;padding:0 2mm 2mm}
#paper .ph1 .top{display:flex;justify-content:space-between;align-items:baseline}
#paper .ph1 .top .tt{flex:1;text-align:center;font-size:13pt;font-weight:700}
#paper .ph1 .top .no{font-size:15pt}
#paper .ph1 .mid{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
#paper .ph1 .mid .gy{border:1.2px solid #000;border-radius:12px;padding:1px 12px;font-size:11pt}
#paper .ph1 .mid .t{font-size:22pt;font-weight:700;letter-spacing:4px}
#paper .ph1 .mid .who{font-size:9pt;text-align:right;line-height:1.9}
#paper .ph1 .mid .who span{display:inline-block;min-width:30mm;border-bottom:1px solid #000}
#paper .pbody{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
#paper .col{display:flex;flex-direction:column;padding:3mm 3mm 0 1mm;min-height:0}
#paper .col+.col{border-left:1px solid #000;padding:3mm 1mm 0 4mm}
#paper .slot{flex:0 0 50%;overflow:hidden}
#paper .slot.full{flex-basis:100%}
#paper .pf{height:7mm;display:flex;justify-content:center;align-items:flex-end}
#paper .pf span{border:1px solid #000;padding:0 8px;font-size:8.5pt;font-family:sans-serif}
#paper .lbl,#pmeasure .lbl{display:table;border:1.2px solid #000;background:#eee;padding:0 14px;font-family:sans-serif;font-weight:700;font-size:9.5pt;letter-spacing:3px;margin:0 0 6px}
#paper .sec2{text-align:center;font-weight:700;font-size:12pt;border:1.2px solid #000;margin:2mm 0 0;padding:1px 0}
#paper .q img,#pmeasure .q img{display:block;max-width:100%}
#paper .qn,#pmeasure .qn{font-weight:700;font-style:italic;font-size:11pt}
#paper .vq,#pmeasure .vq{font-family:inherit;font-size:10pt;line-height:1.75;padding:0;background:none}
#paper .flow{break-before:page}
#paper .flow h2{font-size:15pt;text-align:center;margin:0 0 2mm;border-bottom:1.5px solid #000;padding-bottom:2mm}
#paper table.ans{border-collapse:collapse;width:100%;margin:4mm 0}
#paper table.ans td,#paper table.ans th{border:1px solid #000;padding:3px 2px;text-align:center;font-size:9pt}
#paper .src{font-size:8pt;color:#333;margin:2mm 0 4mm;line-height:1.6}
#paper .sols{column-count:2;column-gap:8mm;column-rule:1px solid #000;font-size:9pt;line-height:1.6}
#paper .sol{margin:0 0 5mm}
#paper .sol .sh{font-weight:700;border-bottom:1px solid #000;margin-bottom:2px;break-after:avoid}
#paper .sol .it{font-size:8.5pt;color:#333;margin:2px 0}
#paper .sol img{display:block;max-width:100%;break-inside:avoid;margin:2px 0}
#paper .sol .vq{font-size:9pt;line-height:1.65}
.exlist .setitem{position:relative}.exlist .setitem>button[data-set],.exlist .setitem>button[data-exam]{width:100%;height:100%;padding-bottom:38px}
.exlist .setact{position:absolute;bottom:8px;right:8px;display:flex;gap:4px}
.exlist .setact button{padding:2px 8px;font-size:12px;border-color:var(--line)}
.exlist .setprt{color:var(--accent)}.exlist .setprt:hover{border-color:var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>
<header>
  <h1>수능 수학 기출 학습</h1>
  <nav class="tabs">
    <button data-tab="exam" class="on">모의고사 풀기</button>
    <button data-tab="review" hidden>오늘의 복습 <span id="dueCount" class="badge due">0</span></button>
    <button data-tab="tags" hidden>태그로 찾기</button>
    <button data-tab="wrong">오답노트 <span id="wrongCount" class="badge bad">0</span></button>
    <button data-tab="stats">학습 현황</button>
    <button data-tab="units">단원별 문제</button>
  </nav>
  <span style="flex:1"></span>
  <span class="small">2024~2026 수능·모평·학평 · 공통 + 확률과 통계 · 2022 개정 교육과정 분류 · 문항 태그</span>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="variants.js"></script>

<script>
(function(){const miss=['UNITS','ITEMS','CUTMODEL'].filter(k=>!window[k]);
if(miss.length){document.addEventListener('DOMContentLoaded',()=>{document.body.innerHTML='<div style="max-width:560px;margin:60px auto;font:16px/1.7 sans-serif;padding:0 16px"><h2>자료 파일을 찾지 못했습니다</h2><p>index.html은 같은 폴더에 있는 data.js, cutmodel.js, img_q.js, img_s_2024.js, img_s_2025.js, img_s_2026.js 파일과 함께 있어야 열립니다. 기출학습 폴더 안에서 index.html을 더블클릭해 주세요.</p><p style="color:#888">없는 자료: '+miss.join(', ')+'</p></div>'});window.__MISSING=miss}})();
</script>
<script>
window.__APP=function(){
if(window.__MISSING)throw new Error('자료 파일 없음: '+window.__MISSING.join(', '));
const UNITS=window.UNITS, ITEMS=window.ITEMS;
const byId=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const unitBy=Object.fromEntries(UNITS.map(u=>[u.code,u]));
const CIRC=['','①','②','③','④','⑤'];
const KEY='gichul_study_v1';
let DB=window.__DB;
function save(){window.__save(DB)}
function last(id){const a=DB.att[id];return a&&a.length?a[a.length-1]:null}
function status(id){const l=last(id);return l?(l.ok?'ok':'bad'):'none'}
function everWrong(id){return (DB.att[id]||[]).some(a=>!a.ok)}
function ansText(it){return it.mc?CIRC[+it.ans]:it.ans}

// ---- tags: 배점, 단원, 난이도, 핵심 개념, 풀이 전략, 문항 형식 (+ 변형 단계) ----
const TAGS=window.TAGS||{}, TD=window.TAGDEF||{c:{},s:{},f:{},d:{},lv:{}}, VARS=window.VARS||{};
const HAS_TAGS=!!window.TAGS;
const DN={hi:'상',mid:'중',lo:'하'}, DORD={lo:0,mid:1,hi:2};
const NOTAG={c:null,s:[],f:[],d:null,r:null,w:[]};
function tg(id){const t=TAGS[id]||NOTAG;if(!t.w)t.w=[];return t}
const WN=k=>TD.w&&TD.w[k]?TD.w[k].replace(/^유형\d+\s*/,''):k;   // 2027 EBS 수능완성 유형편의 유형 이름(앞의 '유형N'은 빼고 이름만)
const DF={};
ITEMS.forEach(i=>{const t=tg(i.id);t.s.forEach(x=>DF['s:'+x]=(DF['s:'+x]||0)+1);t.f.forEach(x=>DF['f:'+x]=(DF['f:'+x]||0)+1)});
const IDF=k=>Math.log((ITEMS.length+1)/((DF[k]||0)+1));   // a rarer strategy/format says more about two items being alike
// similarity = sum of shared-tag weights; returned with the shared tags so the screen can say why two items are linked
function simParts(a,b){
  const ta=tg(a.id),tb=tg(b.id),P=[];
  if(ta.c&&ta.c===tb.c)P.push([4,TD.c[ta.c]]);
  if(ta.w.length&&tb.w.length){if(ta.w[0]===tb.w[0])P.push([3.5,WN(ta.w[0])]);
    else{const x=ta.w.find(v=>tb.w.includes(v));if(x)P.push([1.5,WN(x)])}}
  if(a.code===b.code)P.push([2.5,unitBy[a.code].name]);
  else if(a.tags.includes(b.code)||b.tags.includes(a.code))P.push([1.2,'관련 단원']);
  else if(unitBy[a.code].mid===unitBy[b.code].mid)P.push([.6,unitBy[a.code].mid]);
  ta.s.filter(x=>tb.s.includes(x)).forEach(x=>P.push([.4+IDF('s:'+x)*.5,TD.s[x]]));

function schedule(id,ok){

function makeMixed(opt){
  for(let tries=0;tries<500;tries++){
    const used={},src={},pick=[];let fail=false;
    for(let n=1;n<=30&&!fail;n++){
      let cand=ITEMS.filter(i=>i.n===n&&(!opt.only2022||i.code!=='C0')&&(used[i.code]||0)<MAXU[i.code]&&(src[i.e]||0)<3);

    }

    const mids=new Set(pick.map(id=>unitBy[byId[id].code].mid));

// ---- grade cut estimate ----
// Each item's difficulty b comes from its EBSi wrong-answer rate (오답률 TOP15); items outside the TOP15 use a
// fitted per-number rate, capped below the exam's 15th rate. b is solved so that EBSi takers (ability ~ N(mu,s))
// miss the item at that rate. Cuts come from the score distribution of all takers (ability ~ N(0,1)).
// A, mu, s and the per-number rates were fitted offline to published 확통 raw-score cuts (leave-one-out error ≈ 3 points).
const CUM=[.04,.11,.23,.40,.60,.77,.89,.96];
function predictCuts(ids){
  const M=window.CUTMODEL, TH=[], W=[], WE=[]; let ws=0, we=0;
  for(let k=0;k<=200;k++){const t=-5+k*.05;TH.push(t);const w=Math.exp(-t*t/2);W.push(w);ws+=w;
    const z=(t-M.mu)/M.s, v=Math.exp(-z*z/2);WE.push(v);we+=v}
  const P=(c,b,t)=>c+(1-c)/(1+Math.exp(-M.A*(t-b)));
  const wrongOf=it=>{const o=M.odap[it.e]||{}; if(o[it.n]!=null)return o[it.n];
    const w15=Math.min(...Object.values(o),1)*.95; return Math.min(1/(1+Math.exp(-M.g[it.n-1])),w15)};
  const bOf=(wrong,c)=>{let lo=-8,hi=8;for(let i=0;i<40;i++){const m=(lo+hi)/2;let p=0;
    for(let j=0;j<TH.length;j++)p+=WE[j]/we*P(c,m,TH[j]); if(1-p>wrong)hi=m;else lo=m}return (lo+hi)/2};
  let D=TH.map(()=>{const a=new Float64Array(101);a[0]=1;return a});
  ids.forEach(id=>{
    const it=xp(id).it, g=it.mc?.2:0, b=bOf(wrongOf(it),g);
    D=D.map((row,j)=>{const p=P(g,b,TH[j]);const N=new Float64Array(101);
      for(let s=0;s<=100;s++){if(!row[s])continue;N[s]+=row[s]*(1-p);if(s+it.pts<=100)N[s+it.pts]+=row[s]*p}return N});
  });
  const dist=new Float64Array(101);D.forEach((row,j)=>{for(let s=0;s<=100;s++)dist[s]+=row[s]*W[j]/ws});
  const tail=new Float64Array(102);for(let s=100;s>=0;s--)tail[s]=tail[s+1]+dist[s];
  return CUM.map(q=>{let s=100;while(s>0&&tail[s]<q)s--;return s});
}
function cutInfo(r){
  const e=EXAMS.find(x=>byId[x+'_01'].label===r.title), M=window.CUTMODEL;

// 시험지처럼 A4 한 쪽을 2단으로 나누고 단마다 문항 2개(위·아래 반씩)를 놓아 아래쪽을 풀이 공간으로 남긴다.
// 반 단에 안 들어가는 긴 문항은 한 단을 다 쓴다. 공통 1~22 → 새 쪽에서 확률과 통계 23~30 → 정답표 → 해설.
function solAttrs(id){return SIMG(id)}
function paperQ(x,k){
  const X=xp(x),it=X.it;
  const lbl=k===0||k===22?'<div class="lbl">5지선다형</div>':(k===15||k===28)?'<div class="lbl">단답형</div>':'';
  if(!X.V) return `<div class="q">${lbl}<img ${QIMG(X.id)} alt="${k+1}번"></div>`;   // 원문항 그림에는 번호·배점이 들어 있다
  let q=tex(X.V.q); const pts=` <span style="white-space:nowrap">[${it.pts}점]</span>`, i=q.indexOf('<div class=\'ch');

function paperRest(title,ids){

  const ansT=rng=>`<table class="ans"><tr><th>번호</th>${rng.map(k=>`<th>${k+1}</th>`).join('')}</tr><tr><th>정답</th>${rng.map(k=>`<td>${xs[k].atext}</td>`).join('')}</tr><tr><th>배점</th>${rng.map(k=>`<td>${xs[k].it.pts}</td>`).join('')}</tr>${anyV?`<tr><th>구분</th>${rng.map(k=>`<td>${xs[k].lv?xs[k].lv+'단계':'원'}</td>`).join('')}</tr>`:''}</table>`;
  const sol=(X,k)=>`<div class="sol"><div class="sh">${k+1}번 · 정답 ${X.atext}</div><div class="it">${X.it.label} ${X.it.n}번${X.lv?` 변형 ${X.lv}단계`:''} · ${unitBy[X.it.code].name}${X.V?'':` · 출제의도: ${X.it.intent}`}</div>`
    +(X.V?`<div class="vq">${tex(X.V.sol)}</div>`:(solAttrs(X.id).map(a=>`<img ${a} alt="해설">`).join('')||'<p>해설 그림이 없습니다.</p>'))+'</div>';
  return `<div class="flow"><h2>${title} 정답</h2>${ansT(r(0,15))}${ansT(r(15,ids.length))}<div class="src">출처: ${xs.map((X,k)=>`${k+1}. ${X.it.label} ${X.it.n}번${X.lv?` 변형 ${X.lv}단계`:''}`).join(' · ')}</div></div>`

// 문항 높이를 재서 쪽을 짠다: 반 단(slot)에 들어가면 반, 아니면 한 단 전체, 그래도 넘치면 줄여서 넣는다.
function paperPages(title,sub,qs){
  const MM=96/25.4, colH=(277-12-7-3)*MM, firstH=(277-27-7-3)*MM;
  const pages=[]; let cur=null;
  const newPage=sec=>{cur={cols:[[],[]],c:0,used:0,sec,first:!pages.length};pages.push(cur)};
  const place=(el,h,sec)=>{
    if(!cur||cur.sec!==sec)newPage(sec);
    const H=cur.first?firstH:colH, full=h>H/2-4;
    if(cur.used+(full?2:1)>2){cur.c++;cur.used=0;if(cur.c>1){newPage(sec)}}
    const H2=cur.first?firstH:colH;
    if(h>H2)el.style.zoom=(H2/h).toFixed(3);
    cur.cols[cur.c].push(`<div class="slot${full?' full':''}">${el.outerHTML}</div>`);cur.used+=full?2:1;
  };
  qs.forEach(([el,h,sec])=>place(el,h,sec));
  const N=pages.length;
  return pages.map((p,k)=>{
    const head=p.first?`<div class="ph1"><div class="top"><span style="min-width:12mm"></span><span class="tt">${sub}</span><span class="no">${k+1}</span></div><div class="mid"><span class="gy">제 2 교시</span><span class="t">수학 영역</span><span class="who">성명 <span></span><br>수험 번호 <span></span></span></div></div>`
      :`<div class="ph">${k%2?`<span class="no">${k+1}</span><span class="t">수학 영역</span><span class="gr">고3</span>`:`<span class="gr">고3</span><span class="t">수학 영역</span><span class="no" style="text-align:right">${k+1}</span>`}</div>`;
    const sec=p.sec&&(k===0||pages[k-1].sec!==p.sec)?`<div class="sec2">선택과목 (확률과 통계)</div>`:'';
    return `<div class="pg">${head}${sec}<div class="pbody"><div class="col">${p.cols[0].join('')}</div><div class="col">${p.cols[1].join('')}</div></div><div class="pf"><span>${k+1} / ${N}</span></div></div>`;
  }).join('');
}
// 그림(웹 버전은 서명된 주소)이 다 받아진 뒤 쪽을 짜고 인쇄 창을 연다. 인쇄 창에서 'PDF로 저장'을 고르면 PDF가 된다.
function printPaper(title,ids,sub){
  const P=document.getElementById('paper');
  let M=document.getElementById('pmeasure'); if(!M){M=document.createElement('div');M.id='pmeasure';document.body.appendChild(M)}
  M.innerHTML=ids.map((x,k)=>paperQ(x,k)).join('');
  P.innerHTML=paperRest(title,ids);   // 해설 그림도 미리 받기 시작
  const t0=Date.now(), oldTitle=document.title;
  const ready=()=>[...M.querySelectorAll('img'),...P.querySelectorAll('img')].every(im=>im.complete&&im.naturalWidth>1);
  const go=()=>{
    const qs=[...M.children].map((el,k)=>[el,el.getBoundingClientRect().height,k>=22?1:0]);
    P.innerHTML=paperPages(title,sub||title,qs)+paperRest(title,ids); M.innerHTML='';
    const imgs=[...P.querySelectorAll('img')];
    Promise.all(imgs.map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r}))).then(()=>{
      document.body.classList.add('paper-print');document.title=title;window.print();document.title=oldTitle;
      setTimeout(()=>document.body.classList.remove('paper-print'),500)});
  };
  (function wait(){if(ready()||Date.now()-t0>30000)go();else setTimeout(wait,200)})();
}

function related(it){
  if(HAS_TAGS) return similar(it,8);
  // same unit first, then units sharing a tag; unsolved/wrong before solved, similar point value first
  const score=j=>{const s=status(j.id);return (s==='none'?0:s==='bad'?1:3)+Math.abs((j.pts||3)-(it.pts||3))*0.6+(j.code===it.code?0:2)};
  const pool=ITEMS.filter(j=>j.id!==it.id&&(j.code===it.code||it.tags.includes(j.code)||j.tags.includes(it.code)));
  return pool.sort((a,b)=>score(a)-score(b)).slice(0,6).map(j=>({j,why:[],pct:null}));
}
function openQ(id,seq,preset,v){

    const rel=related(it), vs=VARS[it.id]||[];
    const relItem=x=>`<div class="item" data-id="${x.j.id}"><span>${x.j.label} ${x.j.n}번 · ${x.j.pts}점${x.j.code!==it.code?` · ${unitBy[x.j.code].name}`:''}${ddBadge(x.j.id)}${x.pct!=null?`<span class="pct">${x.pct}%</span>`:''}${x.why.length?`<span class="why">같은 태그: ${x.why.join(', ')}</span>`:''}</span>${stBadge(x.j.id)}</div>`;
    const vItem=lv=>`<div class="item" data-v="${lv}"><span>${lv===cur.v?'▶ ':''}${TD.lv[lv]||lv+'단계'}${vs[lv-1]?`<span class="dd d-${vs[lv-1].d}">${DN[vs[lv-1].d]}</span>`:''}</span>${vstBadge(it.id,lv)}</div>`;
    let vh='';
    if(vs.length){
      const order=!V?(cur.ok?[3,2,1]:[1,2,3]):cur.ok?[1,2,3].filter(x=>x>cur.v).concat([1,2,3].filter(x=>x<cur.v)):[1,2,3].filter(x=>x<cur.v).reverse().concat([1,2,3].filter(x=>x>cur.v));
      const ttl=!V?(cur.ok?'더 어려운 변형에 도전해 보세요':'변형 문제로 다시 풀어 보세요 (1단계부터)'):cur.ok?'다음 단계 변형':'한 단계 쉬운 변형부터 다시';
      vh=`<div class="rel"><h4>${ttl}</h4>`+(V?`<div class="item" data-v="0"><span>원 문항 (${it.label} ${it.n}번)</span>${stBadge(it.id)}</div>`:'')+order.filter(x=>vs[x-1]).map(vItem).join('')+'</div>';
    }
    if(!cur.ok) right+=vh+`<div class="rel"><h4>${HAS_TAGS?'태그가 비슷한 문제로 한 번 더 연습해 보세요':'같은 단원 문제로 한 번 더 연습해 보세요'}</h4>`+rel.map(relItem).join('')+(HAS_TAGS?'<p class="small" style="margin:4px 0 0">%는 핵심 개념·단원·풀이 전략·난이도·배점·문항 형식 태그가 이 문제와 얼마나 겹치는지입니다.</p>':'')+'</div>';
    else right+=vh+`<div class="rel"><h4>관련 문제</h4>`+rel.slice(0,3).map(relItem).join('')+'</div>';
  }
  const ckey=()=>{const k=cur.seq.indexOf(cur.v?it.id+'#'+cur.v:it.id);return k>=0?k:cur.seq.indexOf(it.id)};
  if(cur.seq){const k=ckey();right+=`<div style="margin-top:auto;display:flex;gap:8px;justify-content:space-between"><button class="btn" id="prev" ${k<=0?'disabled':''}>← 이전</button><span class="small" style="align-self:center">${k+1} / ${cur.seq.length}</span><button class="btn" id="next" ${k>=cur.seq.length-1?'disabled':''}>다음 →</button></div>`}
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="left">${left}</div><div class="right">${right}</div>`;
  sh.querySelector('.close').onclick=closeQ;
  sh.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{cur.pick=+b.dataset.k;drawQ()});
  const sa=sh.querySelector('#sa'); if(sa){sa.oninput=()=>cur.pick=sa.value.trim();sa.onkeydown=e=>{if(e.key==='Enter')submit()};sa.focus()}
  const q=s=>sh.querySelector(s);
  if(q('#submit')) q('#submit').onclick=submit;
  if(q('#giveup')) q('#giveup').onclick=()=>{cur.pick=null;grade(false);cur.showSol=true;drawQ()};
  if(q('#sol')) q('#sol').onclick=()=>{cur.showSol=!cur.showSol;drawQ()};
  if(q('#retry')) q('#retry').onclick=()=>{cur.done=false;cur.pick=null;cur.showSol=false;drawQ()};
  sh.querySelectorAll('.rel .item[data-id]').forEach(el=>el.onclick=()=>{openQ(el.dataset.id,null)});
  sh.querySelectorAll('.rel .item[data-v]').forEach(el=>el.onclick=()=>{openQ(it.id,null,null,+el.dataset.v)});
  sh.querySelectorAll('.chip[data-tag]').forEach(el=>el.onclick=()=>goTag(el.dataset.tag));
  if(q('#prev')) q('#prev').onclick=()=>{const k=ckey();openKey(cur.seq[k-1],cur.seq)};
  if(q('#next')) q('#next').onclick=()=>{const k=ckey();openKey(cur.seq[k+1],cur.seq)};
  if(cur.preset&&cur.seq){ // reviewing an exam result: move between its questions with their recorded answers
    const r=DB.results[state.res], go=k=>{const nid=cur.seq[k];openKey(nid,cur.seq,{pick:r.ans[nid]??null,ok:!!r.marks[nid]})};
    const k=ckey();
    if(q('#prev')) q('#prev').onclick=()=>go(k-1);
    if(q('#next')) q('#next').onclick=()=>go(k+1);
  }
}
function submit(){
  const it=cur.it;
  if(cur.pick==null||cur.pick===''){alert('답을 먼저 고르거나 입력하세요.');return}
  const V=cur.v?VARS[it.id][cur.v-1]:null;
  grade(String(cur.pick).replace(/^0+(?=\d)/,'')===String(V?V.ans:it.ans));
  drawQ();
}
function grade(ok){
  const it=cur.it; cur.done=true; cur.ok=ok;
  if(cur.v){DB.vatt=DB.vatt||{};(DB.vatt[vkey(it.id,cur.v)]=DB.vatt[vkey(it.id,cur.v)]||[]).push({t:Date.now(),ok,a:cur.pick});cur.preset=null;save();return}
  (DB.att[it.id]=DB.att[it.id]||[]).push({t:Date.now(),ok,a:cur.pick,s:Math.round((Date.now()-cur.t0)/1000)});
  schedule(it.id,ok); cur.preset=null;
  save(); refreshBadges();
}
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeQ()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)closeQ()});
render();

};
</script>
</body>
