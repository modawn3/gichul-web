<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선생님 화면 · 기출 학습</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e2e5ea;--text:#1d2330;--muted:#6b7385;--accent:#2f6fde;--accent-soft:#e8f0fd;--ok:#1f9d55;--ok-soft:#e6f6ec;--bad:#d64545;--bad-soft:#fdeceb;--warn:#b7791f;--warn-soft:#fdf5e6}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text);font-size:15px}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:18px;margin:0;white-space:nowrap}
nav.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;font-size:15px;cursor:pointer;color:var(--muted)}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:22px 0 8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
select,.btn,input[type=text],textarea{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}
.btn{cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--muted)}.tile .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 0;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:500;background:var(--panel);position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}th.n{text-align:right}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.lo{color:var(--bad);font-weight:600}.hi{color:var(--ok);font-weight:600}.mu{color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
textarea{width:100%;min-height:160px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(20,25,35,.45);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:30px 16px}
.ov.show{display:flex}.sheet{background:var(--panel);border-radius:14px;max-width:820px;width:100%;padding:18px 20px}
.sheet img{max-width:100%;display:block;margin:8px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--accent)}
.note{background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
</style>
</head>
<body>
<header>
  <h1>선생님 화면</h1>
  <nav class="tabs">
    <button data-tab="class" class="on">반 현황</button>
    <button data-tab="accounts">학생 계정</button>
    <button data-tab="upload" id="tabUpload" hidden>문항 이미지 올리기</button>
  </nav>
</header>
<main id="main"></main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="scount.js"></script>
<script src="tags.js"></script>
<script src="web.js"></script>
<script>
window.__TEACHER = async function (ME) {
const UNITS = window.UNITS, ITEMS = window.ITEMS, TAGS = window.TAGS || {}, TD = window.TAGDEF || { c: {} };
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i])), unitBy = Object.fromEntries(UNITS.map(u => [u.code, u]));
const CIRC = ['', '①', '②', '③', '④', '⑤'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const pctCell = p => p == null ? '<td class="n mu">–</td>' : `<td class="n ${p < 50 ? 'lo' : p >= 80 ? 'hi' : ''}">${p}%</td>`;
const fmt = t => { if (!t) return '–'; const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` };
const isAdmin = ME.role === 'admin';
if (isAdmin) document.getElementById('tabUpload').hidden = false;
const main = document.getElementById('main');
let tab = 'class', cls = null, period = 'all', CLASSES = [], studentsCache = {}, attCache = {};

// 볼 수 있는 반: 선생님은 담당 반, 관리자는 학생이 있는 모든 반
async function loadClasses() {
  if (isAdmin) {
    const ps = await fetchAll(() => sb.from('profiles').select('grade,class').eq('role', 'student').order('grade').order('class'));
    CLASSES = [...new Set(ps.map(p => p.grade + '-' + p.class))];
  } else {
    const { data } = await sb.from('teacher_classes').select('grade,class').order('grade').order('class');
    CLASSES = (data || []).map(p => p.grade + '-' + p.class);
  }
  if (!cls || !CLASSES.includes(cls)) cls = CLASSES[0] || null;
}
async function students(c) {
  if (studentsCache[c]) return studentsCache[c];
  const [g, k] = c.split('-').map(Number);
  return studentsCache[c] = await fetchAll(() => sb.from('profiles').select('id,login_id,name,grade,class,number').eq('role', 'student').eq('grade', g).eq('class', k).order('number').order('login_id'));
}
async function attempts(c) {
  if (attCache[c]) return attCache[c];
  const ids = (await students(c)).map(s => s.id), out = [];
  for (let i = 0; i < ids.length; i += 40) {
    const part = ids.slice(i, i + 40);
    out.push(...await fetchAll(() => sb.from('attempts').select('id,user_id,item_id,variant,ok,answer,mode,at').in('user_id', part).order('id')));
  }
  out.forEach(a => a.t = Date.parse(a.at));
  return attCache[c] = out;
}
function inPeriod(a) { return period === 'all' || a.t >= Date.now() - (+period) * 86400000 }

// 학생·문항마다 마지막 풀이로 맞음/틀림을 정한다(학생 화면의 학습 현황과 같은 기준)
function lastBy(att) {
  const m = new Map();
  for (const a of att) if (!a.variant && byId[a.item_id]) m.set(a.user_id + '|' + a.item_id, a);
  return [...m.values()];
}

async function renderClass() {
  if (!CLASSES.length) { main.innerHTML = `<div class="note">${isAdmin ? '아직 학생 계정이 없습니다. "학생 계정" 탭에서 명단으로 만들어 주세요.' : '담당 반이 지정되지 않았습니다. 관리자에게 담당 반 지정을 요청하세요.'}</div>`; return }
  main.innerHTML = '<p class="small">불러오는 중…</p>';
  const st = await students(cls), all = await attempts(cls), att = all.filter(inPeriod);
  const orig = att.filter(a => !a.variant), last = lastBy(att), week = Date.now() - 7 * 86400000;
  const per = Object.fromEntries(st.map(s => [s.id, { s, n: 0, ok: 0, items: 0, week: 0, v: 0, lastT: 0 }]));
  for (const a of att) { const p = per[a.user_id]; if (!p) continue; if (a.variant) p.v++; else p.n++; if (a.t > week) p.week++; if (a.t > p.lastT) p.lastT = a.t }
  for (const a of last) { const p = per[a.user_id]; if (p) { p.items++; if (a.ok) p.ok++ } }
  const active = Object.values(per).filter(p => p.week > 0).length;
  const lastOk = last.filter(a => a.ok).length;

  const byUnit = {}, byConc = {}, byItem = {};
  for (const a of last) {
    const it = byId[a.item_id], u = (byUnit[it.code] = byUnit[it.code] || { n: 0, ok: 0 }); u.n++; if (a.ok) u.ok++;
    const c = (TAGS[a.item_id] || {}).c; if (c) { const x = (byConc[c] = byConc[c] || { n: 0, ok: 0 }); x.n++; if (a.ok) x.ok++ }
  }
  // 많이 틀린 문항: 처음 풀었을 때 틀린 학생 비율
  const first = new Map();
  for (const a of orig) { const k = a.user_id + '|' + a.item_id; if (!first.has(k)) first.set(k, a) }
  for (const a of first.values()) { const x = (byItem[a.item_id] = byItem[a.item_id] || { n: 0, bad: 0, picks: {} }); x.n++; if (!a.ok) { x.bad++; if (a.answer != null) x.picks[a.answer] = (x.picks[a.answer] || 0) + 1 } }
  const minN = Math.max(2, Math.ceil(st.length * 0.1));
  const hard = Object.entries(byItem).filter(([, x]) => x.n >= minN && x.bad).sort((a, b) => b[1].bad / b[1].n - a[1].bad / a[1].n || b[1].n - a[1].n).slice(0, 20);
  const weakC = Object.entries(byConc).filter(([, x]) => x.n >= minN).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n).slice(0, 15);

  let h = `<div class="toolbar"><select id="selCls">${CLASSES.map(c => { const [g, k] = c.split('-'); return `<option value="${c}" ${c === cls ? 'selected' : ''}>${g}학년 ${k}반</option>` }).join('')}</select>
    <select id="selPer">${[['all', '전체 기간'], ['7', '최근 7일'], ['30', '최근 30일']].map(([v, t]) => `<option value="${v}" ${v === period ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <button class="btn" id="reload">새로 고침</button><button class="btn" id="csv">표 내려받기(CSV)</button></div>
  <div class="tiles">
    <div class="tile"><div class="k">학생</div><div class="v">${st.length}명</div></div>
    <div class="tile"><div class="k">최근 7일 푼 학생</div><div class="v">${active}명</div></div>
    <div class="tile"><div class="k">풀이 수 (원 문항)</div><div class="v">${orig.length}</div></div>
    <div class="tile"><div class="k">반 정답률 (문항별 마지막 풀이)</div><div class="v">${last.length ? pct(lastOk, last.length) + '%' : '–'}</div></div>
  </div>
  <h3>학생별</h3><div class="panel"><table><thead><tr><th class="n">번호</th><th>이름</th><th>아이디</th><th class="n">푼 문항</th><th class="n">정답률</th><th class="n">최근 7일 풀이</th><th class="n">변형 풀이</th><th>마지막 활동</th></tr></thead><tbody>`
    + st.map(s => { const p = per[s.id]; return `<tr class="click" data-stu="${s.id}"><td class="n">${s.number ?? ''}</td><td>${esc(s.name)}</td><td class="mu">${esc(s.login_id)}</td><td class="n">${p.items}</td>${pctCell(pct(p.ok, p.items))}<td class="n">${p.week}</td><td class="n">${p.v}</td><td class="mu">${fmt(p.lastT)}</td></tr>` }).join('')
    + `</tbody></table></div><p class="small">학생을 누르면 단원별 정답률과 틀린 문항을 볼 수 있습니다.</p>
  <div class="two"><div><h3>단원별 정답률</h3><div class="panel"><table><thead><tr><th>단원</th><th class="n">풀이(학생×문항)</th><th class="n">정답률</th></tr></thead><tbody>`
    + UNITS.filter(u => byUnit[u.code]).map(u => `<tr><td>${esc(u.name)} <span class="mu">${esc(u.subject)}</span></td><td class="n">${byUnit[u.code].n}</td>${pctCell(pct(byUnit[u.code].ok, byUnit[u.code].n))}</tr>`).join('')
    + `</tbody></table></div></div><div><h3>약한 핵심 개념 (정답률 낮은 순)</h3><div class="panel"><table><thead><tr><th>핵심 개념</th><th class="n">풀이</th><th class="n">정답률</th></tr></thead><tbody>`
    + (weakC.map(([c, x]) => `<tr><td>${esc(TD.c[c] || c)}</td><td class="n">${x.n}</td>${pctCell(pct(x.ok, x.n))}</tr>`).join('') || '<tr><td colspan="3" class="mu">아직 풀이가 적습니다.</td></tr>')
    + `</tbody></table></div></div></div>
  <h3>많이 틀린 문항 (처음 풀 때 틀린 비율, ${minN}명 이상 푼 문항)</h3><div class="panel"><table><thead><tr><th>문항</th><th>단원</th><th class="n">배점</th><th class="n">푼 학생</th><th class="n">틀린 비율</th><th>많이 고른 오답</th></tr></thead><tbody>`
    + (hard.map(([id, x]) => { const it = byId[id], top = Object.entries(x.picks).sort((a, b) => b[1] - a[1])[0]; return `<tr class="click" data-item="${id}"><td>${esc(it.label)} ${it.n}번</td><td>${esc(unitBy[it.code].name)}</td><td class="n">${it.pts}</td><td class="n">${x.n}</td><td class="n lo">${pct(x.bad, x.n)}%</td><td class="mu">${top ? (it.mc ? CIRC[+top[0]] || top[0] : top[0]) + ` (${top[1]}명)` : ''}</td></tr>` }).join('') || '<tr><td colspan="6" class="mu">아직 풀이가 적습니다.</td></tr>')
    + '</tbody></table></div>';
  main.innerHTML = h;
  main.querySelector('#selCls').onchange = e => { cls = e.target.value; renderClass() };
  main.querySelector('#selPer').onchange = e => { period = e.target.value; renderClass() };
  main.querySelector('#reload').onclick = () => { delete attCache[cls]; delete studentsCache[cls]; renderClass() };
  main.querySelector('#csv').onclick = () => download(`${cls}반_학생별.csv`, [['번호', '이름', '아이디', '푼 문항', '정답률', '최근7일 풀이', '변형 풀이', '마지막 활동']].concat(st.map(s => { const p = per[s.id]; return [s.number ?? '', s.name, s.login_id, p.items, p.items ? pct(p.ok, p.items) : '', p.week, p.v, p.lastT ? new Date(p.lastT).toLocaleString('ko-KR') : ''] })));
  main.querySelectorAll('[data-stu]').forEach(r => r.onclick = () => showStudent(per[r.dataset.stu].s, att.filter(a => a.user_id === r.dataset.stu)));
  main.querySelectorAll('[data-item]').forEach(r => r.onclick = () => showItem(r.dataset.item, byItem[r.dataset.item]));
}
function sheet(h) { const ov = document.getElementById('ov'); document.getElementById('sheet').innerHTML = h + '<div class="toolbar" style="margin-top:14px"><button class="btn" id="cl">닫기</button></div>'; ov.classList.add('show'); document.getElementById('cl').onclick = () => ov.classList.remove('show') }
document.getElementById('ov').onclick = e => { if (e.target.id === 'ov') e.target.classList.remove('show') };
function showStudent(s, att) {
  const last = lastBy(att), byU = {};
  for (const a of last) { const u = (byU[byId[a.item_id].code] = byU[byId[a.item_id].code] || { n: 0, ok: 0 }); u.n++; if (a.ok) u.ok++ }
  const wrong = last.filter(a => !a.ok).sort((a, b) => b.t - a.t);
  sheet(`<h2>${esc(s.name)} <span class="small">${esc(s.login_id)} · ${s.grade}학년 ${s.class}반 ${s.number ?? ''}번</span></h2>
   <h3>단원별</h3><div class="panel"><table><thead><tr><th>단원</th><th class="n">푼 문항</th><th class="n">정답률</th></tr></thead><tbody>${UNITS.filter(u => byU[u.code]).map(u => `<tr><td>${esc(u.name)}</td><td class="n">${byU[u.code].n}</td>${pctCell(pct(byU[u.code].ok, byU[u.code].n))}</tr>`).join('') || '<tr><td colspan="3" class="mu">풀이 기록이 없습니다.</td></tr>'}</tbody></table></div>
   <h3>지금 틀린 상태인 문항 (${wrong.length})</h3><div class="panel"><table><thead><tr><th>문항</th><th>단원</th><th>핵심 개념</th><th>푼 날</th></tr></thead><tbody>${wrong.map(a => { const it = byId[a.item_id], c = (TAGS[a.item_id] || {}).c; return `<tr class="click" data-item="${a.item_id}"><td>${esc(it.label)} ${it.n}번</td><td>${esc(unitBy[it.code].name)}</td><td class="mu">${esc(c ? TD.c[c] : '')}</td><td class="mu">${fmt(a.t)}</td></tr>` }).join('') || '<tr><td colspan="4" class="mu">없음</td></tr>'}</tbody></table></div>`);
  document.querySelectorAll('#sheet [data-item]').forEach(r => r.onclick = () => showItem(r.dataset.item));
}
function showItem(id, x) {
  const it = byId[id];
  sheet(`<h2>${esc(it.label)} ${it.n}번 <span class="small">${it.pts}점 · ${esc(unitBy[it.code].name)} · 정답 ${it.mc ? CIRC[+it.ans] : esc(it.ans)}</span></h2>${x ? `<p class="small">이 반에서 ${x.n}명이 처음 풀었고 ${x.bad}명이 틀렸습니다.</p>` : ''}<img ${QIMG(id)} alt="문제">`);
}
function download(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v }).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name; a.click();
}

// ---- 학생 계정 ----
const COLS = { '아이디': 'login_id', '이름': 'name', '학년': 'grade', '반': 'class', '번호': 'number', '비밀번호': 'password', '역할': 'role', '담당반': 'classes' };
const ROLE = { '학생': 'student', '선생님': 'teacher', '교사': 'teacher', '관리자': 'admin', student: 'student', teacher: 'teacher', admin: 'admin' };
function parseTable(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { rows: [], err: '내용이 없습니다.' };
  const sep = lines[0].includes('\t') ? '\t' : ',';
  const split = l => { const out = []; let cur = '', q = false; for (let i = 0; i < l.length; i++) { const ch = l[i]; if (q) { if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++ } else if (ch === '"') q = false; else cur += ch } else if (ch === '"') q = true; else if (ch === sep) { out.push(cur); cur = '' } else cur += ch } out.push(cur); return out.map(s => s.trim()) };
  const head = split(lines[0]).map(h => COLS[h.replace(/\s/g, '')]);
  if (!head.includes('login_id') || !head.includes('name')) return { rows: [], err: '첫 줄에 "아이디"와 "이름" 열이 있어야 합니다.' };
  const rows = lines.slice(1).map(l => { const v = split(l), r = {}; head.forEach((k, i) => { if (k && v[i] !== undefined && v[i] !== '') r[k] = v[i] }); return r });
  for (const r of rows) {
    if (r.role) r.role = ROLE[r.role] || r.role;
    if (r.classes) r.classes = r.classes.split(/[;\/\s]+/).filter(Boolean).map(x => x.split('-').map(Number));
  }
  return { rows };
}
let pending = [], results = [];
async function renderAccounts() {
  main.innerHTML = '<p class="small">불러오는 중…</p>';
  const ps = await fetchAll(() => sb.from('profiles').select('login_id,name,role,grade,class,number,created_at').order('grade').order('class').order('number').order('login_id'));
  let h = `<h2>명단으로 계정 만들기</h2>
  <p class="small">엑셀에서 표를 복사해 붙여 넣거나 CSV 파일을 고르세요. 첫 줄은 열 이름입니다: <b>아이디, 이름, 학년, 반, 번호</b>는 꼭, <b>비밀번호</b>는 선택(비우면 6자리 숫자를 만들어 드립니다)${isAdmin ? ', <b>역할</b>(학생/선생님, 비우면 학생), <b>담당반</b>(선생님만, 예: 3-1;3-2)' : ''}. 아이디는 영문 소문자와 숫자로, 학번을 쓰면 편합니다.</p>
  <div class="toolbar"><input type="file" id="csvf" accept=".csv,.txt,.tsv"><button class="btn" id="sample">예시 양식 내려받기</button></div>
  <textarea id="csvt" placeholder="아이디,이름,학년,반,번호,비밀번호&#10;30201,김민준,3,2,1,&#10;30202,이서연,3,2,2,"></textarea>
  <div class="toolbar" style="margin-top:8px"><button class="btn" id="preview">확인하기</button><button class="btn primary" id="create" ${pending.length ? '' : 'disabled'}>${pending.length ? pending.length + '명 계정 만들기' : '계정 만들기'}</button><span id="prog" class="small"></span></div>
  <div id="pv"></div>
  <div class="two"><div><h3>비밀번호 초기화</h3><div class="toolbar"><input type="text" id="rid" placeholder="아이디"><button class="btn" id="rpw">새 비밀번호 만들기</button></div><div id="rout" class="small"></div></div>`
    + (isAdmin ? `<div><h3>선생님 담당 반 지정 (관리자)</h3><div class="toolbar"><input type="text" id="tid" placeholder="선생님 아이디"><input type="text" id="tcls" placeholder="예: 3-1;3-2"><button class="btn" id="setc">지정</button></div><div id="tout" class="small"></div>
       <h3>계정 지우기 (관리자)</h3><div class="toolbar"><input type="text" id="did" placeholder="아이디 (여러 개는 쉼표)"><button class="btn" id="del">지우기</button></div><div id="dout" class="small"></div></div>` : '') + `</div>
  <h3>등록된 계정 (${ps.length})</h3><div class="panel"><table><thead><tr><th>아이디</th><th>이름</th><th>역할</th><th class="n">학년</th><th class="n">반</th><th class="n">번호</th><th>만든 날</th></tr></thead><tbody>`
    + ps.map(p => `<tr><td>${esc(p.login_id)}</td><td>${esc(p.name)}</td><td>${{ student: '학생', teacher: '선생님', admin: '관리자' }[p.role]}</td><td class="n">${p.grade ?? ''}</td><td class="n">${p.class ?? ''}</td><td class="n">${p.number ?? ''}</td><td class="mu">${fmt(Date.parse(p.created_at))}</td></tr>`).join('') + '</tbody></table></div>';
  main.innerHTML = h;
  const $ = s => main.querySelector(s);
  if (results.length) showResults();
  $('#csvf').onchange = async e => { const f = e.target.files[0]; if (!f) return; const buf = await f.arrayBuffer(); let t = new TextDecoder('utf-8').decode(buf); if (t.includes('�')) t = new TextDecoder('euc-kr').decode(buf); $('#csvt').value = t; preview() };
  $('#sample').onclick = () => download('계정명단_양식.csv', [['아이디', '이름', '학년', '반', '번호', '비밀번호'].concat(isAdmin ? ['역할', '담당반'] : []), ['30201', '김민준', '3', '2', '1', ''], ['30202', '이서연', '3', '2', '2', '']].concat(isAdmin ? [['t_kim', '김선생', '', '', '', '', '선생님', '3-1;3-2']] : []));
  function preview() {
    const { rows, err } = parseTable($('#csvt').value);
    pending = err ? [] : rows;
    $('#pv').innerHTML = err ? `<p class="bad">${err}</p>` : `<p class="small">${rows.length}명을 읽었습니다. 맞으면 "계정 만들기"를 누르세요.</p><div class="panel" style="max-height:300px;overflow:auto"><table><thead><tr><th>아이디</th><th>이름</th><th>학년</th><th>반</th><th>번호</th><th>비밀번호</th>${isAdmin ? '<th>역할</th><th>담당반</th>' : ''}</tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.login_id)}</td><td>${esc(r.name)}</td><td>${esc(r.grade)}</td><td>${esc(r.class)}</td><td>${esc(r.number)}</td><td class="mu">${r.password ? '지정함' : '자동'}</td>${isAdmin ? `<td>${esc(r.role || 'student')}</td><td>${esc((r.classes || []).map(x => x.join('-')).join(';'))}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
    $('#create').disabled = !pending.length; $('#create').textContent = pending.length ? pending.length + '명 계정 만들기' : '계정 만들기';
  }
  $('#preview').onclick = preview;
  $('#create').onclick = async () => {
    const rows = pending.slice(); if (!rows.length) return;
    $('#create').disabled = true; results = [];
    for (let i = 0; i < rows.length; i += 20) {
      $('#prog').textContent = `만드는 중… ${i}/${rows.length}`;
      const { data, error } = await sb.functions.invoke('admin', { body: { action: 'create_users', rows: rows.slice(i, i + 20) } });
      if (error) { const m = await errText(error); rows.slice(i, i + 20).forEach(r => results.push({ login_id: r.login_id, error: m })); continue }
      data.results.forEach((r, k) => results.push({ ...r, name: rows[i + k].name, grade: rows[i + k].grade, class: rows[i + k].class, number: rows[i + k].number, password: r.password || (r.ok ? rows[i + k].password : '') }));
    }
    pending = []; studentsCache = {}; attCache = {};
    await renderAccounts();
  };
  $('#rpw').onclick = async () => {
    const id = $('#rid').value.trim(); if (!id) return;
    const { data, error } = await sb.functions.invoke('admin', { body: { action: 'reset_password', login_id: id } });
    $('#rout').innerHTML = error ? `<span class="bad">${esc(await errText(error))}</span>` : `${esc(data.login_id)}의 새 비밀번호: <b style="font-size:16px;color:var(--text)">${esc(data.password)}</b>`;
  };
  if (isAdmin) {
    $('#setc').onclick = async () => {
      const classes = $('#tcls').value.split(/[;\/\s,]+/).filter(Boolean).map(x => x.split('-').map(Number));
      const { error } = await sb.functions.invoke('admin', { body: { action: 'set_classes', login_id: $('#tid').value.trim(), classes } });
      $('#tout').innerHTML = error ? `<span class="bad">${esc(await errText(error))}</span>` : '지정했습니다.';
    };
    $('#del').onclick = async () => {
      const ids = $('#did').value.split(/[,\s]+/).filter(Boolean); if (!ids.length) return;
      if (!confirm(`${ids.join(', ')} 계정과 풀이 기록을 지웁니다. 되돌릴 수 없습니다. 지울까요?`)) return;
      const { data, error } = await sb.functions.invoke('admin', { body: { action: 'delete_users', login_ids: ids } });
      $('#dout').innerHTML = error ? `<span class="bad">${esc(await errText(error))}</span>` : data.results.map(r => `${esc(r.login_id)}: ${r.ok ? '지움' : esc(r.error)}`).join('<br>') || '찾은 계정이 없습니다.';
      studentsCache = {}; attCache = {}; if (!error) setTimeout(renderAccounts, 800);
    };
  }
}
function showResults() {
  const ok = results.filter(r => r.ok), bad = results.filter(r => !r.ok);
  const el = document.createElement('div');
  el.innerHTML = `<div class="note">${ok.length}명 만들었습니다${bad.length ? `, ${bad.length}명은 못 만들었습니다` : ''}. 비밀번호는 지금만 볼 수 있으니 <b>결과 내려받기</b>로 저장해 학생들에게 나눠 주세요.</div>
  <div class="toolbar"><button class="btn primary" id="dlres">결과 내려받기(CSV)</button></div>
  <div class="panel" style="max-height:320px;overflow:auto"><table><thead><tr><th>아이디</th><th>이름</th><th>결과</th><th>비밀번호</th></tr></thead><tbody>${results.map(r => `<tr><td>${esc(r.login_id)}</td><td>${esc(r.name)}</td><td class="${r.ok ? 'ok' : 'bad'}">${r.ok ? '만듦' : esc(r.error)}</td><td>${esc(r.password || '')}</td></tr>`).join('')}</tbody></table></div>`;
  main.querySelector('#pv').appendChild(el);
  el.querySelector('#dlres').onclick = () => download('계정_만들기_결과.csv', [['아이디', '이름', '학년', '반', '번호', '비밀번호', '결과']].concat(results.map(r => [r.login_id, r.name, r.grade, r.class, r.number, r.password || '', r.ok ? '만듦' : r.error])));
}

// ---- 문항 이미지 올리기(관리자): 오프라인 프로그램의 img_q.js, img_s_*.js에서 그림을 꺼내 비공개 저장소에 올린다 ----
async function listAll(prefix) {
  const out = new Set();
  for (let off = 0; ; off += 1000) {
    const { data, error } = await sb.storage.from('items').list(prefix, { limit: 1000, offset: off });
    if (error) throw error;
    data.forEach(o => out.add(prefix + '/' + o.name));
    if (data.length < 1000) return out;
  }
}
async function renderUpload() {
  main.innerHTML = '<p class="small">저장소를 확인하는 중…</p>';
  const have = new Set([...await listAll('q'), ...await listAll('s')]);
  const needQ = ITEMS.length, needS = Object.values(window.SCOUNT || {}).reduce((a, b) => a + b, 0);
  const hasQ = [...have].filter(p => p.startsWith('q/')).length, hasS = have.size - hasQ;
  main.innerHTML = `<h2>문항 이미지 올리기</h2>
  <div class="tiles"><div class="tile"><div class="k">문제 그림</div><div class="v">${hasQ} / ${needQ}</div></div><div class="tile"><div class="k">해설 그림</div><div class="v">${hasS} / ${needS}</div></div></div>
  <p class="small">오프라인 기출학습 폴더(또는 배포 zip)에 있는 <b>img_q.js</b>, <b>img_s_2024.js</b>, <b>img_s_2025.js</b>, <b>img_s_2026.js</b>를 한꺼번에 고르세요. 영어는 <b>img_q_en.js</b>, <b>img_s_en.js</b>를 고르면 됩니다(위 개수는 수학 기준). 이미 올라간 그림은 건너뜁니다. 새 회차를 추가한 뒤에도 같은 방법으로 올리면 됩니다.</p>
  <div class="toolbar"><input type="file" id="imgf" multiple accept=".js"><label class="small"><input type="checkbox" id="over"> 이미 있는 그림도 다시 올리기</label><button class="btn primary" id="go" disabled>올리기</button></div>
  <div id="ust" class="small"></div><div class="bar"><i id="ubar" style="width:0"></i></div>`;
  const $ = s => main.querySelector(s);
  let jobs = [];
  $('#imgf').onchange = async e => {
    jobs = [];
    for (const f of e.target.files) {
      const t = await f.text();
      for (const m of t.matchAll(/"((?:en_)?\d{4}_[^"]+?_\d\d)":("data:image\/png;base64,[^"]+"|\[[^\]]*\])/g)) {
        if (m[2][0] === '"') jobs.push([`q/${imgKey(m[1])}.png`, m[2].slice(1, -1)]);
        else [...m[2].matchAll(/"(data:image\/png;base64,[^"]+)"/g)].forEach((x, k) => jobs.push([`s/${imgKey(m[1])}_${k + 1}.png`, x[1]]));
      }
    }
    const todo = $('#over').checked ? jobs : jobs.filter(j => !have.has(j[0]));
    $('#ust').textContent = `그림 ${jobs.length}장을 찾았고, 그중 ${todo.length}장을 올립니다.`;
    $('#go').disabled = !todo.length;
  };
  $('#over').onchange = () => $('#imgf').dispatchEvent(new Event('change'));
  $('#go').onclick = async () => {
    const todo = $('#over').checked ? jobs : jobs.filter(j => !have.has(j[0]));
    $('#go').disabled = true; $('#imgf').disabled = true;
    let done = 0, fail = [];
    const next = async () => {
      while (todo.length) {
        const [path, url] = todo.shift();
        const blob = await (await fetch(url)).blob();
        let error;
        for (let tries = 0; tries < 3; tries++) { ({ error } = await sb.storage.from('items').upload(path, blob, { contentType: 'image/png', upsert: true, cacheControl: '604800' })); if (!error) break }
        if (error) fail.push(path + ': ' + error.message); else have.add(path);
        done++; const n = done + todo.length;
        $('#ust').textContent = `올리는 중… ${done}장 완료${fail.length ? `, 실패 ${fail.length}` : ''}`; $('#ubar').style.width = (done / n * 100) + '%';
      }
    };
    await Promise.all(Array.from({ length: 6 }, next));
    $('#ust').innerHTML = `다 올렸습니다. ${fail.length ? `<span class="bad">실패 ${fail.length}장: ${esc(fail.slice(0, 5).join(', '))}${fail.length > 5 ? ' …' : ''}</span> 다시 고르고 올리면 실패한 것만 올라갑니다.` : ''}`;
    setTimeout(renderUpload, fail.length ? 4000 : 1500);
  };
}

function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const f = tab === 'class' ? renderClass : tab === 'accounts' ? renderAccounts : renderUpload;
  f().catch(e => { console.error(e); main.innerHTML = `<p class="bad">불러오지 못했습니다: ${esc(e.message || e)}</p>` });
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render() });
await loadClasses();
if (isAdmin && !CLASSES.length) tab = 'accounts';
render();
};
